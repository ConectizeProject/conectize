name: Bling Token Refresh

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call token refresh endpoint
        env:
          CRON_URL: ${{ secrets.BLING_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "Missing secret: BLING_CRON_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing secret: CRON_SECRET"
            exit 1
          fi

          # Remove \r, espaços no início/fim e aspas ao redor (erro comum ao colar secrets no GitHub)
          CRON_URL=$(printf '%s' "$CRON_URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CRON_SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ "${#CRON_SECRET}" -ge 2 ]; then
            if [ "${CRON_SECRET:0:1}" = '"' ] && [ "${CRON_SECRET: -1}" = '"' ]; then
              CRON_SECRET="${CRON_SECRET#\"}"
              CRON_SECRET="${CRON_SECRET%\"}"
            fi
          fi

          # Se o secret for só o domínio (ex.: https://www.conectize.com.br), acrescenta o path da API.
          # Se já tiver .../bling-refresh-tokens, mantém.
          CRON_URL="${CRON_URL%/}"
          case "$CRON_URL" in
            *bling-refresh-tokens*) ;;
            *)
              if printf '%s' "$CRON_URL" | grep -qE '^https?://[^/]+$'; then
                CRON_URL="${CRON_URL}/api/cron/bling-refresh-tokens"
                echo "BLING_CRON_URL era só o domínio — ajustado para: $CRON_URL"
              else
                echo "ERRO: BLING_CRON_URL deve terminar em /api/cron/bling-refresh-tokens"
                echo "       ou ser só a origem (ex.: https://www.conectize.com.br)."
                echo "       Valor atual: $CRON_URL"
                exit 1
              fi
              ;;
          esac

          # GET: mesmo método que a Vercel Cron usa no path; POST pode receber 405 atrás de proxy/CDN
          # ou após redirect (301/302 costumam virar GET e perder o corpo).
          echo "Calling: $CRON_URL"

          HTTP_CODE=$(curl -sS -L --max-redirs 5 -o response.json -w "%{http_code}" \
            -X GET "$CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET")

          echo "HTTP $HTTP_CODE"
          cat response.json
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Token refresh failed (HTTP)"
            exit 1
          fi
          if ! jq -e '.ok == true' response.json >/dev/null 2>&1; then
            echo "Token refresh failed (JSON ok != true)"
            if head -c 5 response.json | grep -q '<!DOC\|<html'; then
              echo "A resposta é HTML (página do site), não JSON da API. Confira BLING_CRON_URL no GitHub (Secrets)."
            fi
            exit 1
          fi
